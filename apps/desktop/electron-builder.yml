appId: app.intray.desktop
productName: Intray
# Stamps app-update.yml so electron-updater can poll GitHub Releases.
# Local packs use `--publish never`; CI release workflow uses `--publish always`.
publish:
  provider: github
  owner: keithsimkin
  repo: intray-email-client
  releaseType: release
copyright: Copyright © 2026 Intray contributors
# Lets browsers and other apps hand mailto: links to a packaged Intray.
protocols:
  - name: Intray Mail
    schemes:
      - mailto
artifactName: Intray-${version}-${os}-${arch}.${ext}
compression: normal
npmRebuild: false
asar: true
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - from: ../../crates/intray-native
    to: node_modules/@intray/native
    filter:
      - index.js
      - index.d.ts
      - "*.node"
asarUnpack:
  - "**/*.node"
win:
  artifactName: Intray-Setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  executableName: Intray
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  selectPerMachineByDefault: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Intray
  uninstallDisplayName: Intray
  displayLanguageSelector: false
  installerLanguages:
    - en_US
  unicode: true
  packElevateHelper: true
  runAfterFinish: true
  menuCategory: false
  license: ../../LICENSE
  include: build/installer.nsh
  installerHeader: installer-header.bmp
  installerSidebar: installer-sidebar.bmp
  uninstallerSidebar: uninstaller-sidebar.bmp
  differentialPackage: false
mac:
  category: public.app-category.productivity
  # Apple Silicon first; Intel / universal later.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true
  # CI ships unsigned until Apple Developer signing + notarization secrets exist.
  identity: null
dmg:
  artifactName: Intray-${version}-mac-${arch}.${ext}
  title: Intray ${version}
  writeUpdateInfo: false
