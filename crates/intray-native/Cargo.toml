[package]
name = "intray-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
