[build]
  base = "apps/web"
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.2"
  # Set secrets in the Netlify UI (not here):
  # DODO_PAYMENTS_API_KEY, DODO_PAYMENTS_WEBHOOK_KEY,
  # DODO_PRODUCT_MONTHLY, DODO_PRODUCT_ONCE
  DODO_PAYMENTS_ENVIRONMENT = "live_mode"
  DODO_PAYMENTS_RETURN_URL = "https://intray.site/thanks"

[[plugins]]
  package = "@netlify/plugin-nextjs"
