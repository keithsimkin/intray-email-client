<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WeWork email signature</title>
</head>
<body style="margin:0;padding:28px 24px;background:#ffffff;">
  <!--
    Email signature rebuilt from the WeWork signature image.
    Paste this table into a signature field. The wordmark and banner
    sit next to this file (wework-wordmark.png, wework-banner.png).
    Before sending, host those two images and replace the src values
    with the public URLs — mail clients will not load relative paths.
  -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="552" style="border-collapse:collapse;width:100%;max-width:552px;font-family:Arial,Helvetica,sans-serif;color:#000000;">
    <tr>
      <td style="padding:0;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:20px;font-weight:700;color:#000000;">
        John Doe
      </td>
    </tr>
    <tr>
      <td style="padding:5px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:21px;font-weight:400;color:#000000;">
        Chief Technology Officer
      </td>
    </tr>
    <tr>
      <td style="padding:14px 0 0;line-height:0;font-size:0;">
        <img src="wework-wordmark.png" width="137" height="29" alt="WeWork" style="display:block;border:0;outline:none;text-decoration:none;width:137px;height:29px;" />
      </td>
    </tr>
    <tr>
      <td style="padding:27px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:16.5px;line-height:20px;font-weight:400;color:#000000;">
        <a href="tel:+16464289786" style="color:#000000;text-decoration:none;">(646) 428-9786</a>
        <span style="color:#000000;">&nbsp;|&nbsp;</span>
        <a href="tel:+16463893922" style="color:#000000;text-decoration:none;">(646) 389-3922</a>
      </td>
    </tr>
    <tr>
      <td style="padding:6px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:16.5px;line-height:20px;font-weight:400;color:#000000;">
        <a href="https://www.google.com/maps/search/?api=1&amp;query=115+W+18th+St+New+York+NY+10011" style="color:#000000;text-decoration:none;">WeWork HQ, 115 W 18th St. New York, NY 10011</a>
      </td>
    </tr>
    <tr>
      <td style="padding:6px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:16.5px;line-height:20px;font-weight:400;">
        <a href="https://www.wework.com" style="color:#262637;text-decoration:underline;">www.wework.com</a>
      </td>
    </tr>
    <tr>
      <td style="padding:23px 0 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
          <tr>
            <td bgcolor="#131313" style="background-color:#131313;border-radius:8px;">
              <a href="tel:+16464289786" style="display:inline-block;padding:11px 18px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:16px;font-weight:400;color:#ffffff;text-decoration:none;">Book a call</a>
            </td>
            <td width="11" style="width:11px;font-size:0;line-height:0;">&nbsp;</td>
            <td style="border:1px solid #000000;border-radius:8px;">
              <a href="https://www.wework.com/contact-us" style="display:inline-block;padding:10px 17px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:16px;font-weight:400;color:#000000;text-decoration:none;">Book a visit</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:21px 0 0;line-height:0;font-size:0;">
        <img src="wework-banner.png" width="552" height="93" alt="Reimagine your workspace" style="display:block;border:0;outline:none;text-decoration:none;width:100%;max-width:552px;height:auto;" />
      </td>
    </tr>
  </table>
</body>
</html>
