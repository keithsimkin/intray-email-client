name: Release desktop

# Builds Windows x64 + macOS Apple Silicon for a GitHub Release.
# Bump apps/desktop/package.json (and the root version) to match the release tag first.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload installers to (e.g. v0.1.2)"
        required: true
        type: string
      platform:
        description: "Which platform(s) to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - windows
          - macos

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    if: >-
      github.event_name == 'release' ||
      inputs.platform == 'both' ||
      inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native mail store
        run: bun run build:native

      - name: Build desktop bundles
        run: bun --filter @intray/desktop build

      - name: Package and upload to GitHub Release
        working-directory: apps/desktop
        env:
          # Ensure electron-builder publishes into the requested release tag.
          GH_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bunx electron-builder --win --x64 --publish always

  macos:
    name: macOS Apple Silicon
    if: >-
      github.event_name == 'release' ||
      inputs.platform == 'both' ||
      inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native mail store
        run: bun run build:native

      - name: Build desktop bundles
        run: bun --filter @intray/desktop build

      - name: Package and upload to GitHub Release
        working-directory: apps/desktop
        env:
          GH_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # Unsigned until Apple Developer signing + notarization secrets exist.
        run: bunx electron-builder --mac --arm64 --publish always
