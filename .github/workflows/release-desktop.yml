name: Release desktop

# Builds Windows x64 + macOS Apple Silicon whenever a GitHub Release is published.
# Bump apps/desktop/package.json (and the root version) to match the release tag first.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            electron_args: --win --x64
          - name: macOS Apple Silicon
            os: macos-14
            electron_args: --mac --arm64

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Unsigned CI builds until Apple/Windows signing secrets are wired up.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native mail store
        run: bun run build:native

      - name: Build desktop bundles
        run: bun --filter @intray/desktop build

      - name: Package and upload to GitHub Release
        working-directory: apps/desktop
        run: bunx electron-builder ${{ matrix.electron_args }} --publish always
